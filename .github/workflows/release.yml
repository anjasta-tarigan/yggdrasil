name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11.x requires Node >= 22.13 (it loads the node:sqlite builtin).
          node-version: 22

      - name: Setup pnpm
        # Version comes from the `packageManager` field in package.json.
        # Passing `version` here too makes action-setup fail with
        # "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        # `LayoutProps<"/">` and friends are generated into .next/types, so a
        # clean checkout fails `tsc` until typegen has run.
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Generate installer checksums
        run: |
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
          generate_release_notes: true
