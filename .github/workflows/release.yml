name: Release

# ---------------------------------------------------------------------------
# Owns the *creation* of a release: every `v*` tag push is gated by a full
# type-check + test suite, then the installer assets are regenerated and
# published to that tag's GitHub Release.
#
# Division of labor with publish-installer.yml:
#   - release.yml (tag: v*)          — the RELEASE CREATOR. Validates the code
#                                      and publishes the 4 installer assets with
#                                      generated release notes.
#   - publish-installer.yml (main)   — the ASSET REFRESHER. Re-publishes the same
#                                      4 assets to the *latest* release on every
#                                      feature merge into main, so the
#                                      checksum-verified `irm`/`curl` install path
#                                      always serves the latest merged main code.
#
# Both workflows write byte-identical assets (plain `sha256sum install.sh`, see
# the checksum step) and share the `yggdrasil-installer-assets` concurrency group,
# so an overlapping run serializes instead of racing a double-upload.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"

# contents: write is required for softprops/action-gh-release to create/edit the
# release and upload assets.
permissions:
  contents: write

# Serialize against publish-installer.yml: a release tag push and the
# accompanying main merge both touch installer assets; never let them overlap.
concurrency:
  group: yggdrasil-installer-assets
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Validate Windows installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate install.ps1 (PowerShell parse)
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errs)
          if ($errs) {
            $errs | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1: syntax OK"

      - name: Execute encoded build command with Windows paths
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "O'Brien Yggdrasil"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $logPath = Join-Path $testDir 'build.log'
          $quotedLogPath = $logPath.Replace("'", "''")
          $pwshCmd = "Write-Output 'build command ran' | Tee-Object -FilePath '$quotedLogPath'; exit `$LASTEXITCODE"
          $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($pwshCmd))
          $output = & powershell.exe -NoProfile -EncodedCommand $encodedCommand
          if ($LASTEXITCODE -ne 0 -or $output -ne 'build command ran' -or (Get-Content $logPath -Raw).Trim() -ne 'build command ran') {
            throw "Encoded command failed: $output"
          }

  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    needs: windows-installer
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history + tags so the gated code, typegen, and any tooling that
          # walks history resolve correctly on the tagged commit.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        # Version comes from the `packageManager` field in package.json; passing
        # an explicit version here makes action-setup fail with "Multiple versions
        # of pnpm specified".
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        # `LayoutProps<"/">` and friends are generated into .next/types, so a
        # clean checkout fails `tsc` until typegen has run.
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      # Fast, platform-stable gate: the CLI + installer tests (bootstrap checksum
      # gate, build timeout, APP_SECRET verification). The heavy full suite is
      # intentionally not run here — it includes jsdom tests that are slow and
      # environment-sensitive; the scoped subset covers everything that ships
      # through the installer pipeline.
      - name: Installer & CLI tests
        run: pnpm exec vitest run --project unit src/cli

      - name: Validate install.sh (POSIX syntax)
        # The Windows installer has its own Windows runner gate above.
        run: bash -n install.sh
      - name: Generate installer checksums
        run: |
          # Plain sha256sum (text mode) emits "<hex>  install.sh" (two spaces).
          # install.sh verifies with `sha256sum -c`; install.ps1 uses
          # (Get-Content).Trim().Split(" ")[0] — both expect that exact format.
          # Do NOT strip the filename and do NOT use -b (binary, "*" prefix).
          sha256sum install.sh  > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
          echo "Generated checksums:"
          cat install.sh.sha256 install.ps1.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
          generate_release_notes: true
