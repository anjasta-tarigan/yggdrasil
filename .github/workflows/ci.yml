name: CI

# ---------------------------------------------------------------------------
# Merge gate for the integration branch.
#
# Runs on every PR targeting `development` and on direct pushes to `development`,
# so a broken installer or CLI change can never reach `main` through a release
# (release.yml re-runs the same tsc/test gate on the tag). This is the
# "quality gate" half of the enterprise pipeline; release.yml (tag) and
# publish-installer.yml (main merge) are the publishing halves.
#
# Coverage is intentionally a hard gate: the bootstrap installer tests assert the
# supply-chain verification + build-timeout + APP_SECRET behavior of both
# installers, so an installer regression fails CI before it can ship.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Manual trigger: run the heavy suite on a GitHub-hosted runner instead of a
  # slow local machine. `pnpm test:cloud` dispatches this and waits for it.
  workflow_dispatch:
    inputs:
      scope:
        description: "What to run"
        type: choice
        options:
          - unit
          - all
          - cli
        default: unit

# Cancel superseded runs on the same ref (e.g. a new push to an open PR) to save
# CI minutes. PR runs from forks are never cancelled mid-flight by this.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Type-check, lint & test
    # Draft PRs and PRs marked "work in progress" still run, but a PR explicitly
    # converted to a draft should not block the queue — skip non-ready PRs.
    # `workflow_dispatch` has no pull_request payload, so it must pass this gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so PR / base diff tooling (if a step needs it) is sound.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint .

      # Fast, platform-stable subset for PR feedback. The heavy full suite is
      # kept as the release gate in release.yml (it includes jsdom tests that
      # depend on a browser-grade environment). Here we gate the changes that
      # actually ship through the installer pipeline: the CLI + installer tests
      # (bootstrap/secret/build-timeout verification) plus the env-handling
      # modules they exercise. A failure here means a broken installer or CLI
      # change would reach main.
      - name: Installer & CLI tests
        run: pnpm exec vitest run --project unit src/cli

      # Safety net: if the scoped path ever changes, the whole unit suite still
      # runs on release so nothing regresses silently.

  installer-syntax:
    name: Validate POSIX installer script
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate install.sh (POSIX syntax)
        run: bash -n install.sh

  windows-installer:
    name: Validate Windows installer
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate install.ps1 (PowerShell parse)
        shell: pwsh
        run: |
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errs)
          if ($errs) {
            $errs | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1: syntax OK"

      - name: Execute encoded build command with Windows paths
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "O'Brien Yggdrasil"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $logPath = Join-Path $testDir 'build.log'
          $quotedLogPath = $logPath.Replace("'", "''")
          $pwshCmd = "Write-Output 'build command ran' | Tee-Object -FilePath '$quotedLogPath'; exit `$LASTEXITCODE"
          $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($pwshCmd))
          $output = & powershell.exe -NoProfile -EncodedCommand $encodedCommand
          if ($LASTEXITCODE -ne 0 -or $output -ne 'build command ran' -or (Get-Content $logPath -Raw).Trim() -ne 'build command ran') {
            throw "Encoded command failed: $output"
          }

  # ---------------------------------------------------------------------------
  # Cloud test run (opt-in).
  #
  # The local machine is the slow path: the unit suite takes ~50-60 min on 8 GB
  # / 4 cores because vitest is pinned to `maxWorkers: 2`. This job runs the
  # same `pnpm test` on a GitHub-hosted runner on demand, so the answer arrives
  # in minutes and the JUnit report is downloadable as an artifact.
  #
  # Dispatch it with `pnpm test:cloud` (scripts/test-cloud.mjs), or from the
  # Actions tab. Push/PR runs keep using the fast scoped gate above.
  # ---------------------------------------------------------------------------
  full-suite:
    name: Full test suite (cloud)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        # `LayoutProps<"/">` and friends are generated into .next/types, so tsc
        # fails on a clean checkout until typegen has run.
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: |
          mkdir -p test-report
          REPORTERS="--reporter=default --reporter=junit --outputFile.junit=test-report/junit.xml"
          case "${{ inputs.scope }}" in
            all) pnpm exec vitest run --project unit --project integration $REPORTERS ;;
            cli) pnpm exec vitest run --project unit src/cli $REPORTERS ;;
            *)   pnpm exec vitest run --project unit $REPORTERS ;;
          esac

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Summarise failures
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          path = "test-report/junit.xml"
          if not os.path.exists(path):
              print("## Test summary\n\nNo JUnit report was produced.\n")
              raise SystemExit(0)

          total = 0
          failed = []
          for case in ET.parse(path).getroot().iter("testcase"):
              total += 1
              node = case.find("failure")
              if node is None:
                  node = case.find("error")
              if node is None:
                  continue
              message = (node.get("message") or "").splitlines()[0][:160]
              failed.append(f"- `{case.get('classname')} > {case.get('name')}` {message}")

          print(f"## Test summary\n")
          print(f"- total: {total}")
          print(f"- failed: {len(failed)}\n")
          for line in failed:
              print(line)
          PY
